<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>✨ A Little Birthday Surprise ✨</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #fff0f5,
                #ffd9e6,
                #ffe5d0,
                #fff7ed
            );
            color: #684653;
            position: relative;
        }

        /* Soft background glow */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(255,192,203,.35), transparent 30%);
            pointer-events: none;
        }

        /* Floating hearts */
        .heart {
            position: fixed;
            bottom: -50px;
            color: #ee8eaa;
            font-size: 25px;
            opacity: 0.5;
            animation: floatHeart 7s linear infinite;
            z-index: 1;
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
            font-size: 18px;
        }

        .heart:nth-child(3) {
            left: 70%;
            animation-delay: 4s;
        }

        .heart:nth-child(4) {
            left: 88%;
            animation-delay: 1s;
            font-size: 19px;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: .6;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Balloons */
        .balloon {
            position: fixed;
            font-size: 55px;
            z-index: 2;
            animation: balloonFloat 4s ease-in-out infinite;
        }

        .balloon.left {
            left: 5%;
            top: 15%;
        }

        .balloon.right {
            right: 5%;
            top: 20%;
            animation-delay: 1.5s;
        }

        @keyframes balloonFloat {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-25px) rotate(4deg);
            }
        }

        /* Main area */
        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            position: relative;
            z-index: 5;
        }

        /* Main birthday card */
        .birthday-card {
            width: min(680px, 95%);
            padding: 45px 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 35px;

            box-shadow:
                0 25px 70px rgba(170, 90, 120, .20);

            backdrop-filter: blur(12px);

            animation: cardAppear 1s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Small badge */
        .badge {
            display: inline-block;
            padding: 9px 17px;
            border-radius: 50px;

            background: #fff;
            border: 1px solid #f5cbd8;

            color: #c45f80;
            font-size: 13px;
            font-weight: bold;

            box-shadow: 0 8px 20px rgba(190,100,130,.10);
        }

        /* Cake */
        .cake {
            font-size: 65px;
            margin: 20px 0 10px;

            animation: cakeBounce 2.3s ease-in-out infinite;
        }

        @keyframes cakeBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        /* Heading */
        h1 {
            font-family: cursive;
            font-size: clamp(38px, 7vw, 60px);
            font-weight: normal;
            color: #b84e73;
            margin-bottom: 18px;
        }

        .subtitle {
            font-size: 17px;
            line-height: 1.7;
            color: #8b6d79;
            max-width: 500px;
            margin: auto;
        }

        .question {
            font-size: 22px;
            font-weight: bold;
            margin-top: 27px;
            color: #674450;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;

            min-height: 70px;
            margin-top: 22px;
        }

        button {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            padding: 14px 27px;
            cursor: pointer;
            transition: .25s ease;
        }

        /* YES */
        .yes-btn {
            background: #ed789f;
            color: white;
            border: none;

            box-shadow:
                0 10px 25px rgba(237,120,159,.35);
        }

        .yes-btn:hover {
            transform: translateY(-4px) scale(1.04);
            background: #df648d;
        }

        /* NO */
        .no-btn {
            background: white;
            color: #a26b7d;
            border: 2px solid #f1c3d2;
        }

        .no-btn:hover {
            background: #fff5f8;
        }

        /*
           When NO is clicked it becomes
           floating/playful
        */
        .no-btn.running {
            position: fixed;
            z-index: 100;
        }

        .hint {
            display: block;
            margin-top: 15px;
            font-size: 12px;
            color: #aa8b96;
        }

        /* Bottom decoration */
        .decoration {
            margin-top: 25px;
            font-size: 24px;
            letter-spacing: 5px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .birthday-card {
                padding: 35px 20px;
            }

            .balloon {
                font-size: 38px;
            }

            .balloon.left {
                left: 2%;
            }

            .balloon.right {
                right: 2%;
            }

            .question {
                font-size: 19px;
            }

            .buttons {
                gap: 10px;
            }

            button {
                padding: 12px 21px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating decorations -->
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>

    <div class="balloon left">🎈</div>
    <div class="balloon right">🎈</div>


    <!-- Main Card -->
    <div class="container">

        <div class="birthday-card">

            <div class="badge">
                ✨ A Tiny Birthday Surprise ✨
            </div>

            <div class="cake">
                🎂
            </div>

            <h1>
                Hey, Birthday Star! 💗
            </h1>

            <p class="subtitle">
                I made a little corner of the internet
                especially for your special day. 🌸
            </p>

            <p class="question">
                Will you open your surprise? 🌷
            </p>

            <div class="buttons">

                <button
                    class="yes-btn"
                    onclick="openSurprise()">
                    YES! 💖
                </button>

                <button
                    class="no-btn"
                    id="noButton"
                    onclick="moveNoButton()">
                    NO 🙈
                </button>

            </div>

            <span
                class="hint"
                id="hint">
                Psst... choose wisely 😄
            </span>

            <div class="decoration">
                🌸 ✨ 💕 ✨ 🌸
            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        function openSurprise() {
    window.location.href = "memories.html";
}
        const noButton = document.getElementById("noButton");
        const hint = document.getElementById("hint");

        let noClicks = 0;


        function moveNoButton() {

            noClicks++;

            if (noClicks === 1) {

                hint.innerText =
                    "Hehe 😄 the NO button is a little shy!";

            } else if (noClicks === 2) {

                hint.innerText =
                    "Almost! 🙈 But it moved again!";

            } else {

                hint.innerText =
                    "Okay okay... try catching it! 😂✨";

            }


            /*
                Random position
            */

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX =
                window.innerWidth - buttonWidth - 20;

            const maxY =
                window.innerHeight - buttonHeight - 20;


            const randomX =
                Math.max(
                    10,
                    Math.random() * maxX
                );

            const randomY =
                Math.max(
                    10,
                    Math.random() * maxY
                );


            noButton.classList.add("running");

            noButton.style.left =
                randomX + "px";

            noButton.style.top =
                randomY + "px";
        }

    </script>

</body>
</html>
